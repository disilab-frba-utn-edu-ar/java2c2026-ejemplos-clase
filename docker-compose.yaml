version: '3.8'

services:
  # 1. Tu API REST de Java (To-Do List)
  todo-app:
    build: .
    container_name: todo-app-container
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - monitoring-net
    restart: always

#  # 2. Prometheus (Recolector de métricas Micrometer)
#  prometheus:
#    image: prom/prometheus:latest
#    container_name: prometheus-container
#    ports:
#      - "9090:9090"
#    volumes:
#      - ./prometheus.yml:/etc/prometheus/prometheus.yml
#    networks:
#      - monitoring-net
#    depends_on:
#      - todo-app
#    restart: always
#
  # 2. Elasticsearch (para logs / búsqueda)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: elasticsearch-container
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - monitoring-net
    restart: always

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.3
    container_name: filebeat-container
    user: root
    command: ["filebeat", "-e", "-strict.perms=false"]
    volumes:
      - ./filebeat.yaml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring-net
    depends_on:
      - elasticsearch
      - todo-app
    restart: always

  # 3. Kibana (Interfaz visual para Elasticsearch)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: kibana-container
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch-container:9200
    depends_on:
      - elasticsearch
    networks:
      - monitoring-net
    restart: always

#  # 4. Grafana (Para visualizar métricas de Actuator / Micrometer)
#  grafana:
